<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<h1>User Login</h1>

{% for message in messages %}
    <p>{{ message }}</p>
{% endfor %}

<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">Login</button>

</form>

<a href="/register/">Create Account</a>

</body>
</html>
